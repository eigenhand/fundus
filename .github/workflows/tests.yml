name: Tests

# Warum es das gibt: 164 Tests, die bisher nur lief, wer daran dachte. Ein Test, den
# niemand automatisch ausführt, ist eine Behauptung über die Vergangenheit.
#
# Zwei davon überspringen sich hier immer, und das ist erwartet: Core ML rechnet im
# Simulator die SAM-Maske nicht aus — Kodierer und Bewertungen kommen richtig heraus,
# `low_res_masks` ist Byte für Byte null, auf allen drei Rechenwegen. Dasselbe Modell
# auf dem Mac liefert eine Maske, die auf zwei Promille auf dem Prüfrechteck liegt.
# Es ist also nicht der Code, und ein Läufer ohne Gerät ändert daran nichts.
#
# macOS-Minuten zählen bei privaten Repos zehnfach. Deshalb keine Läufe für
# Änderungen, die den Code nicht anfassen, und ein abgebrochener Vorlauf, sobald ein
# neuer Commit kommt.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "**/Info.plist", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "**/Info.plist", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unittests
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # Steht im Protokoll, damit ein Fehlschlag, der an der Werkzeugkette liegt,
      # nicht wie einer im Code aussieht. Das Abbild bringt mehrere Xcodes mit; die
      # Voreinstellung ist 26.6, und genau damit ist dieser Lauf hier geprüft worden.
      - name: Werkzeugkette melden
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: xcodegen einrichten
        run: brew install --quiet xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      # `OS=latest` und keine feste Zahl: das Abbild führt drei Laufzeiten mit, und
      # ohne Angabe bricht xcodebuild mit einem irreführenden „My Mac"-Fehler ab,
      # weil der Gerätename mehrdeutig ist — derselbe Grund, aus dem run-tests.sh
      # die Kennung heraussucht, statt den Namen weiterzureichen.
      - name: Unittests
        run: |
          xcodebuild test \
            -project Fundus.xcodeproj \
            -scheme Fundus \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build/dd \
            -only-testing:FundusTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Testbericht aufheben
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/dd/Logs/Test/*.xcresult
          retention-days: 7
