name: Tests

# Why this exists: 164 tests that until now only ran for whoever remembered them. A
# test nobody runs automatically is an assertion about the past.
#
# Two of them always skip here, and that is expected: Core ML does not compute the
# SAM mask in the simulator — encoder and scores come out correctly, `low_res_masks`
# is zero byte for byte, on all three compute paths. The same model on the Mac
# delivers a mask that sits on the test rectangle to within two parts per thousand.
# So it is not the code, and a runner without a device changes nothing about that.
#
# macOS minutes count tenfold on private repos. Hence no runs for changes that do not
# touch the code, and an aborted earlier run as soon as a
# neuer Commit kommt.
#
# The Info.plist once stood in this list and does not belong in it. It looks like
# configuration but is behaviour: `UIUserInterfaceStyle = Light` stood in there and
# made the entire dark palette inert — a change no test in the world would have
# caught if no test had run.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unittests
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # In the log, so that a failure caused by the toolchain does not look like one
      # in the code. The image carries several Xcodes; the default is 26.6, and that
      # is exactly what this run was checked against.
      - name: Werkzeugkette melden
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: xcodegen einrichten
        run: brew install --quiet xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      # `OS=latest` and not a fixed number: the image carries three runtimes, and
      # without a version xcodebuild fails with a misleading "My Mac" error, because
      # the device name is ambiguous — the same reason run-tests.sh looks the
      # identifier up instead of passing the name along.
      # Runs before the tests, because in one second it says what the test run does
      # not see: Xcode enters new strings into the catalogue by itself while
      # building — untranslated, and without anything turning red.
      - name: Uebersetzungen vollstaendig
        run: ./check-localizations.py

      - name: Unittests
        run: |
          xcodebuild test \
            -project Fundus.xcodeproj \
            -scheme Fundus \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build/dd \
            -only-testing:FundusTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Testbericht aufheben
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/dd/Logs/Test/*.xcresult
          retention-days: 7
